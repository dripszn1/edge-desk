name: live-game-day

# Backlog #16. One long job per game window (CT): Tue-Fri 5:30-11:30 PM, Sat 10 AM-11:30 PM,
# Sun 11 AM-10:30 PM, Mon 6-11:30 PM. Kalshi every ~30 s, sharp odds on budget, scan + SHARP/MODEL
# each pass, commit every ~15 min, exit before the 6 h job limit and re-dispatch itself if the
# window continues. Read-only: never places or prepares orders.
#
# Cron is UTC and GitHub drops slots, so each window start has a slot for both CDT and CST, a
# backup 20 min later, and an hourly :40 backup. The guard job (stdlib, ~10 s) exits unless we
# are inside a window, under LIVE_MINUTES_BUDGET_MONTH, and no live run is already active.
on:
  schedule:
    - cron: "30 22,23 * * 2-5"   # Tue-Fri 5:30 PM CT (CDT, CST)
    - cron: "50 22,23 * * 2-5"   # backup +20 min
    - cron: "0 15,16 * * 6"      # Sat 10 AM CT
    - cron: "20 15,16 * * 6"
    - cron: "0 16,17 * * 0"      # Sun 11 AM CT
    - cron: "20 16,17 * * 0"
    - cron: "30 22,23 * * 1"     # Mon 5:30 PM CT (CDT, CST): CBB tips + MNF
    - cron: "50 22,23 * * 1"
    - cron: "40 * * * *"         # hourly backup; guard exits outside windows
  workflow_dispatch:
    inputs:
      chained:
        description: "Set by the previous live run when it re-dispatches itself"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - name: Window / budget / already-active check
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow live.yml --limit 20 \
                     --json databaseId,status \
                     -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status==\"in_progress\" or .status==\"queued\" or .status==\"pending\" or .status==\"waiting\")] | length" \
                   || echo 0)
          python3 -m edge_desk.live guard "${active:-0}" "${{ github.event.inputs.chained || 'false' }}"

  loop:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (must pass before any data is used)
        run: python -m pytest -q
      - name: Results + backtests (before any snapshot, so no look-ahead)
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m edge_desk.nfl_results 12 || true
          python -m edge_desk.cfb_results 12 || true
          python -m edge_desk.cfb_lines || true
          python -m edge_desk.backtest --if-stale NFL CFB || true
      - name: Kalshi link format check (HTTP 200 against a real market; weekly)
        continue-on-error: true
        run: python -m edge_desk.alerts verify-url
      - name: Live loop
        id: loop
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          git config user.name "edge-desk-bot"
          git config user.email "edge-desk-bot@users.noreply.github.com"
          python -m edge_desk.live loop
      - name: Re-dispatch if the window continues
        if: steps.loop.outputs.redispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chained=true
